openapi: 3.1.0
info:
  title: Devlecta Portfolio API
  version: 1.0.0
  description: API endpoints for portfolio management and browsing

servers:
  - url: http://localhost
    description: Local development
  - url: https://devlecta.com
    description: Production

paths:
  /portfolio:
    get:
      summary: List portfolios with filtering and pagination
      tags: [Portfolio - Public]
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category slug
        - name: technology
          in: query
          schema:
            type: string
          description: Filter by technology slug
        - name: type
          in: query
          schema:
            type: string
            enum: [custom_project, envato_product]
          description: Filter by project type
        - name: industry
          in: query
          schema:
            type: string
          description: Filter by industry
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
          description: Items per page
      responses:
        '200':
          description: Portfolio list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortfolioListItem'
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      last_page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
                        nullable: true
                      next:
                        type: string
                        nullable: true

  /portfolio/{slug}:
    get:
      summary: Get portfolio detail by slug
      tags: [Portfolio - Public]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Portfolio slug
      responses:
        '200':
          description: Portfolio detail retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortfolioDetail'
        '404':
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/portfolio:
    get:
      summary: List all portfolios (admin view with drafts)
      tags: [Portfolio - Admin]
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
      responses:
        '200':
          description: Admin portfolio list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortfolioAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create new portfolio
      tags: [Portfolio - Admin]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePortfolioRequest'
      responses:
        '201':
          description: Portfolio created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortfolioDetail'
                  message:
                    type: string
                    example: Portfolio created successfully
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/portfolio/{id}:
    get:
      summary: Get portfolio for editing
      tags: [Portfolio - Admin]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Portfolio retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortfolioDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update portfolio
      tags: [Portfolio - Admin]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdatePortfolioRequest'
      responses:
        '200':
          description: Portfolio updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PortfolioDetail'
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete portfolio (soft delete)
      tags: [Portfolio - Admin]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Portfolio deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Portfolio deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    PortfolioListItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [custom_project, envato_product]
        featured:
          type: boolean
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            slug:
              type: string
        technologies:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
        thumbnail:
          type: string
          nullable: true
          description: First media item path
        created_at:
          type: string
          format: date-time

    PortfolioDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [custom_project, envato_product]
        industry:
          type: string
          nullable: true
        challenge:
          type: string
          nullable: true
        solution:
          type: string
          nullable: true
        results:
          type: object
          nullable: true
        duration:
          type: string
          nullable: true
        client_name:
          type: string
          nullable: true
        featured:
          type: boolean
        status:
          type: string
          enum: [draft, published, archived]
        category:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            slug:
              type: string
        technologies:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
              category:
                type: string
        media:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              type:
                type: string
              path:
                type: string
              display_order:
                type: integer
        related_projects:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioListItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PortfolioAdmin:
      allOf:
        - $ref: '#/components/schemas/PortfolioDetail'
        - type: object
          properties:
            deleted_at:
              type: string
              format: date-time
              nullable: true

    CreatePortfolioRequest:
      type: object
      required:
        - title
        - description
        - type
        - category_id
        - status
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          minLength: 50
        type:
          type: string
          enum: [custom_project, envato_product]
        category_id:
          type: integer
        industry:
          type: string
          nullable: true
          maxLength: 100
        challenge:
          type: string
          nullable: true
        solution:
          type: string
          nullable: true
        results:
          type: object
          nullable: true
        duration:
          type: string
          nullable: true
          maxLength: 50
        client_name:
          type: string
          nullable: true
          maxLength: 255
        featured:
          type: boolean
          default: false
        status:
          type: string
          enum: [draft, published, archived]
          default: draft
        technology_ids:
          type: array
          items:
            type: integer
        images:
          type: array
          items:
            type: string
            format: binary

    UpdatePortfolioRequest:
      allOf:
        - $ref: '#/components/schemas/CreatePortfolioRequest'

    Error:
      type: object
      properties:
        message:
          type: string

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: This action is unauthorized

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel session cookie (set after login)
