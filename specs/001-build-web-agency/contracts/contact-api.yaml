openapi: 3.1.0
info:
  title: Devlecta Contact & Lead API
  version: 1.0.0
  description: API endpoints for contact form and lead management

servers:
  - url: http://localhost
    description: Local development
  - url: https://devlecta.com
    description: Production

paths:
  /contact:
    post:
      summary: Submit contact form
      tags: [Contact - Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactFormRequest'
      responses:
        '200':
          description: Contact form submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Thank you for your inquiry. We will contact you soon.
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests (rate limit exceeded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Too many contact submissions. Please try again later.

  /admin/leads:
    get:
      summary: List all leads with filtering
      tags: [Leads - Admin]
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, contacted, qualified, converted, closed]
          description: Filter by lead status
        - name: date_from
          in: query
          schema:
            type: string
            format: date
          description: Filter submissions from this date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
          description: Filter submissions to this date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Lead list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lead'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/leads/{id}:
    get:
      summary: Get lead detail
      tags: [Leads - Admin]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lead detail retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Lead'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update lead status and notes
      tags: [Leads - Admin]
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeadRequest'
      responses:
        '200':
          description: Lead updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Lead'
                  message:
                    type: string
                    example: Lead updated successfully
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/leads/export:
    get:
      summary: Export leads to CSV
      tags: [Leads - Admin]
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, contacted, qualified, converted, closed]
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  schemas:
    ContactFormRequest:
      type: object
      required:
        - name
        - email
        - service_interest
        - message
        - preferred_lang
        - recaptcha_token
      properties:
        name:
          type: string
          maxLength: 255
          example: John Doe
        email:
          type: string
          format: email
          maxLength: 255
          example: john@example.com
        phone:
          type: string
          nullable: true
          pattern: '^[+]?[0-9\s\-\(\)]+$'
          example: +1-555-123-4567
        company:
          type: string
          nullable: true
          maxLength: 255
          example: Acme Corp
        service_interest:
          type: string
          maxLength: 100
          example: Custom Web Development
        budget_range:
          type: string
          nullable: true
          maxLength: 50
          example: $10k-$25k
        message:
          type: string
          minLength: 10
          maxLength: 5000
          example: I need a custom e-commerce platform...
        preferred_lang:
          type: string
          enum: [en, id]
          default: en
        recaptcha_token:
          type: string
          description: reCAPTCHA v3 token from client

    Lead:
      type: object
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        phone:
          type: string
          nullable: true
          example: +1-555-123-4567
        company:
          type: string
          nullable: true
          example: Acme Corp
        service_interest:
          type: string
          example: Custom Web Development
        budget_range:
          type: string
          nullable: true
          example: $10k-$25k
        message:
          type: string
          example: I need a custom e-commerce platform...
        preferred_lang:
          type: string
          enum: [en, id]
          example: en
        status:
          type: string
          enum: [new, contacted, qualified, converted, closed]
          example: new
        admin_notes:
          type: string
          nullable: true
          example: Follow up on 2025-10-15
        ip_address:
          type: string
          nullable: true
          example: 192.168.1.1
        created_at:
          type: string
          format: date-time
          example: 2025-10-02T14:30:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-10-02T14:30:00Z

    UpdateLeadRequest:
      type: object
      properties:
        status:
          type: string
          enum: [new, contacted, qualified, converted, closed]
        admin_notes:
          type: string
          nullable: true
          maxLength: 5000

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ['The email field is required.']
            message: ['The message must be at least 10 characters.']

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 5
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 123

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: This action is unauthorized

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource not found

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel session cookie (set after login via Laravel Fortify)
